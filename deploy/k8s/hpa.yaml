apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demanda-ia
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: demanda-ia}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
